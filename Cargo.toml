[package]
name = "agent-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A link store between tracker work items and agent host sessions, with a JSON CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tj-agents/agent-store"
readme = "README.md"
keywords = ["agents", "sessions", "work-items", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlite-use-returning-for-3_35", "sqlx-sqlite", "with-chrono"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
unwrap_used = "deny"
mod_module_files = "warn"
module_name_repetitions = "warn"

[dev-dependencies]
tempfile = "3.27.0"
