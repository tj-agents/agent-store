[package]
name = "agent-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A link store between tracker work items and agent host sessions, with a JSON CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tj-agents/agent-store"
readme = "README.md"
keywords = ["agents", "sessions", "work-items", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
unwrap_used = "deny"
mod_module_files = "warn"
module_name_repetitions = "warn"
